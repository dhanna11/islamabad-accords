# Runs on every pull request and every push to main. GitHub Pages publishes main as is, so this is the check before merging.
name: Check site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: index.html (the pitch, from pitch/) and full.html (the full deck, from deck/) are built by build-slideshow.py, with no warnings
        run: |
          python3 build-slideshow.py 2> build-warnings.txt
          rm -f preview.html preview-full.html
          if [ -s build-warnings.txt ]; then
            cat build-warnings.txt
            echo "::error::The build printed warnings (see above)."
            exit 1
          fi
          if ! git diff --quiet -- index.html full.html || [ -n "$(git status --porcelain -- full.html)" ]; then
            git status --short -- index.html full.html
            echo "::error::index.html or full.html is out of date. Run python3 build-slideshow.py and commit both; never edit them by hand."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test both pages at desktop and phone widths
        working-directory: tests
        run: node smoke.mjs
